<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anonimizador de Datos CSV | FROM TECH 4D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap');

  :root {
    --navy:   #1F3A5F;
    --lima:   #A8CC00;
    --cyan:   #00B4D8;
    --white:  #FFFFFF;
    --bg:     #F4F7FA;
    --card:   #FFFFFF;
    --border: #DDE4EE;
    --text:   #2A4262;
    --muted:  #6B7A90;
    --success-bg:  #EAFAF1; --success-txt: #1E8449; --success-brd: #A9DFBF;
    --danger-bg:   #FEECEB; --danger-txt:  #C0392B; --danger-brd:  #F1948A;
    --warning-bg:  #FEF9EC; --warning-txt: #B7770D; --warning-brd: #F7DC6F;
    --info-bg:     #EBF5FF; --info-txt:    #185FA5; --info-brd:    #AED6F1;
    --pro-bg:      #F4ECF7; --pro-txt:     #7D3C98; --pro-brd:     #C39BD3;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .app-header {
    background: var(--navy);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .app-header-left { display: flex; align-items: center; gap: 14px; }
  .header-logo {
    height: 32px;
    display: flex; align-items: center; gap: 8px;
  }
  .logo-icon {
    width: 32px; height: 32px;
    background: var(--lima);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800; color: var(--navy);
  }
  .logo-text { color: white; font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
  .logo-text span { color: var(--lima); }
  .header-divider { width: 1px; height: 24px; background: rgba(255,255,255,.2); }
  .header-title { color: rgba(255,255,255,.85); font-size: 13px; font-weight: 500; }
  .header-badge {
    background: rgba(168,204,0,.15);
    border: 1px solid rgba(168,204,0,.3);
    color: var(--lima);
    font-size: 10px; font-weight: 700;
    padding: 3px 10px; border-radius: 20px;
    letter-spacing: 0.5px;
  }

  /* ── CONTENT ── */
  .app-body { max-width: 880px; margin: 0 auto; padding: 28px 20px 60px; }

  /* ── STEP BAR ── */
  .step-bar {
    display: flex; gap: 8px; margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .step-pill {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 20px;
    font-size: 12px; font-weight: 600;
    border: 1.5px solid var(--border);
    background: white; color: var(--muted);
    transition: all 0.15s;
    cursor: default;
  }
  .step-pill .num {
    width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 800;
    background: var(--border); color: var(--muted);
    flex-shrink: 0;
  }
  .step-pill.active {
    background: var(--navy); color: var(--lima);
    border-color: var(--navy);
  }
  .step-pill.active .num { background: var(--lima); color: var(--navy); }
  .step-pill.done {
    background: var(--success-bg); color: var(--success-txt);
    border-color: var(--success-brd);
  }
  .step-pill.done .num { background: var(--success-txt); color: white; }

  /* ── CARD ── */
  .card {
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--border);
    padding: 24px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 14px; font-weight: 700; color: var(--navy);
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }

  /* ── DROP ZONE ── */
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    background: #FAFBFD;
  }
  .drop-zone:hover, .drop-zone.over {
    border-color: var(--navy);
    background: #EEF3FA;
  }
  .drop-icon { font-size: 36px; margin-bottom: 12px; }
  .drop-main { font-size: 15px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }
  .drop-sub  { font-size: 12px; color: var(--muted); }

  /* ── DEMOS ── */
  .demo-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .demo-btn {
    background: white; border: 1.5px solid var(--border);
    border-radius: 8px; padding: 8px 14px;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px; font-weight: 600; color: var(--navy);
    cursor: pointer; transition: all 0.12s;
    display: flex; align-items: center; gap: 6px;
  }
  .demo-btn:hover { border-color: var(--navy); background: var(--bg); }

  /* ── STATS ── */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px; margin-bottom: 18px;
  }
  .stat-card {
    background: var(--bg); border-radius: 10px;
    border: 1px solid var(--border);
    padding: 14px 16px; text-align: center;
  }
  .stat-num { font-size: 26px; font-weight: 800; color: var(--navy); }
  .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; font-weight: 500; }

  /* ── QUICK PRESETS ── */
  .quick-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .quick-btn {
    background: white; border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 12px;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px; font-weight: 600; color: var(--text);
    cursor: pointer; transition: all 0.12s;
  }
  .quick-btn:hover { background: var(--bg); border-color: var(--navy); color: var(--navy); }

  /* ── COLUMN TABLE ── */
  .col-table-wrap { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .col-table { width: 100%; border-collapse: collapse; }
  .col-table thead { background: var(--navy); }
  .col-table th {
    color: white; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.6px;
    padding: 10px 14px; text-align: left;
  }
  .col-table td {
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .col-table tr:last-child td { border-bottom: none; }
  .col-table tr:nth-child(even) td { background: #FAFBFD; }
  .col-table tr:hover td { background: #EEF3FA; }
  .col-name  { font-weight: 700; color: var(--navy); font-size: 13px; }
  .col-sample { font-size: 10px; color: var(--muted); font-family: monospace; margin-top: 2px; }

  .col-table select {
    font-family: 'Montserrat', sans-serif;
    font-size: 12px; padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 6px; background: white;
    color: var(--text); cursor: pointer;
    min-width: 160px;
  }
  .col-table select:focus { outline: 2px solid var(--cyan); outline-offset: 1px; }

  .badge {
    display: inline-block; font-size: 10px; font-weight: 700;
    padding: 3px 9px; border-radius: 20px; white-space: nowrap;
  }
  .badge-conservar  { background: var(--success-bg); color: var(--success-txt); }
  .badge-suprimir   { background: var(--danger-bg);  color: var(--danger-txt);  }
  .badge-tokenizar  { background: var(--info-bg);    color: var(--info-txt);    }
  .badge-enmascarar { background: var(--warning-bg); color: var(--warning-txt); }
  .badge-rango      { background: var(--pro-bg);     color: var(--pro-txt);     }

  /* ── PREVIEW ── */
  .preview-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
  .preview-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .preview-table th {
    background: var(--navy); color: white;
    padding: 9px 12px; text-align: left;
    font-weight: 600; font-size: 10px;
    white-space: nowrap; letter-spacing: 0.3px;
  }
  .preview-table td {
    padding: 7px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    font-family: monospace; font-size: 11px;
  }
  .preview-table tr:last-child td { border-bottom: none; }
  .preview-table tr:nth-child(even) td { background: #FAFBFD; }
  .cell-ok        { color: var(--text); }
  .cell-suprimido { color: var(--muted); font-style: italic; }
  .cell-token     { color: var(--info-txt); font-weight: 600; }
  .cell-mascara   { color: var(--warning-txt); }
  .cell-rango     { color: var(--pro-txt); }

  .preview-legend {
    display: flex; gap: 14px; flex-wrap: wrap;
    font-size: 11px; margin-top: 10px; color: var(--muted);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* ── ALERTS ── */
  .alert {
    border-radius: 8px; padding: 12px 16px;
    font-size: 12px; margin-bottom: 14px;
    display: flex; gap: 10px; align-items: flex-start;
    border: 1px solid;
  }
  .alert-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .alert-info    { background: var(--info-bg);    border-color: var(--info-brd);    color: var(--info-txt);    }
  .alert-success { background: var(--success-bg); border-color: var(--success-brd); color: var(--success-txt); }
  .alert-danger  { background: var(--danger-bg);  border-color: var(--danger-brd);  color: var(--danger-txt);  }

  /* ── BUTTONS ── */
  .btn-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-top: 4px; }
  .btn {
    font-family: 'Montserrat', sans-serif;
    font-size: 13px; font-weight: 700;
    padding: 10px 20px; border-radius: 8px;
    border: none; cursor: pointer; transition: all 0.12s;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-primary { background: var(--navy); color: var(--lima); }
  .btn-primary:hover { opacity: 0.88; }
  .btn-download { background: var(--lima); color: var(--navy); }
  .btn-download:hover { opacity: 0.88; }
  .btn-outline {
    background: transparent; color: var(--navy);
    border: 1.5px solid var(--border);
  }
  .btn-outline:hover { background: var(--bg); border-color: var(--navy); }

  /* ── SUCCESS STATE ── */
  .success-center { text-align: center; padding: 20px 0 10px; }
  .success-icon { font-size: 48px; margin-bottom: 12px; }
  .success-title { font-size: 18px; font-weight: 800; color: var(--navy); margin-bottom: 6px; }
  .success-file  { font-size: 13px; color: var(--muted); font-family: monospace; margin-bottom: 20px; }

  /* ── DIVIDER ── */
  .divider { border: none; border-top: 1px solid var(--border); margin: 18px 0; }

  /* ── FOOTER ── */
  .app-footer {
    background: var(--navy);
    padding: 14px 28px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; margin-top: 40px;
  }
  .app-footer-left { color: rgba(255,255,255,.6); }
  .app-footer-left b { color: white; }
  .app-footer-right { color: rgba(255,255,255,.4); }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .app-header { padding: 12px 16px; }
    .app-body { padding: 20px 14px 40px; }
    .stats-row { grid-template-columns: 1fr 1fr; }
    .btn-row { flex-direction: column; align-items: stretch; }
    .btn { justify-content: center; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="app-header">
  <div class="app-header-left">
    <div class="header-logo">
      <div class="logo-icon">F</div>
      <div class="logo-text">FROM <span>TECH 4D</span></div>
    </div>
    <div class="header-divider"></div>
    <div class="header-title">Anonimizador de Datos CSV</div>
  </div>
  <div class="header-badge">PRIVACIDAD · LFPDPPP</div>
</header>

<!-- BODY -->
<div class="app-body">

  <!-- STEP BAR -->
  <div class="step-bar" id="stepBar">
    <div class="step-pill active" id="s1"><span class="num">1</span>Cargar archivo</div>
    <div class="step-pill" id="s2"><span class="num">2</span>Etiquetar columnas</div>
    <div class="step-pill" id="s3"><span class="num">3</span>Vista previa</div>
    <div class="step-pill" id="s4"><span class="num">4</span>Descargar</div>
  </div>

  <!-- STEP CONTENT -->
  <div id="stepContent"></div>

</div>

<!-- FOOTER -->
<footer class="app-footer">
  <div class="app-footer-left">
    <b>FROM TECH 4D</b> &nbsp;|&nbsp; 378 111 4980 &nbsp;|&nbsp; fromtechmx@gmail.com
  </div>
  <div class="app-footer-right">Anonimizador CSV · v1.0 · 2026</div>
</footer>

<script>
(function () {
  /* ═══════════════════════════════════════════
     ESTADO GLOBAL
  ═══════════════════════════════════════════ */
  let parsedData = [];
  let headers    = [];
  let columnRules = {};
  let step       = 1;
  let fileName   = '';

  const TECHNIQUES = [
    { value: 'conservar',  label: 'Conservar tal cual',     badge: 'badge-conservar'  },
    { value: 'suprimir',   label: 'Suprimir (eliminar)',    badge: 'badge-suprimir'   },
    { value: 'tokenizar',  label: 'Tokenizar → ID único',   badge: 'badge-tokenizar'  },
    { value: 'enmascarar', label: 'Enmascarar con ★',       badge: 'badge-enmascarar' },
    { value: 'rango',      label: 'Rango numérico ($)',     badge: 'badge-rango'      },
  ];

  const SENSITIVE = ['nombre','name','telefono','phone','tel','celular','correo','email',
                     'mail','rfc','curp','domicilio','address','direccion','cuenta',
                     'tarjeta','card','paciente','cliente','comprador','contacto'];

  /* ═══════════════════════════════════════════
     DEMOS
  ═══════════════════════════════════════════ */
  const DEMOS = {
    nissan: {
      name: 'leads_nissan.csv',
      rows: [
        ['nombre','telefono','correo','municipio','colonia','modelo_interes','vendedor','etapa','fecha','precio'],
        ['María López Gutiérrez','3781234567','maria@gmail.com','San Juan de los Lagos','Centro','X-Trail E-Power','Carlos Ruiz','Cotización','2026-07-01','589000'],
        ['Juan Pérez Ramos','3329876543','juan@hotmail.com','Lagos de Moreno','Las Flores','Kicks E-Power','Ana González','Primer contacto','2026-07-02','398000'],
        ['Rosa Martínez Vega','3315551234','rosa@yahoo.com','Tepatitlán','Jardines','Frontier V6','Carlos Ruiz','Demo','2026-07-03','472000'],
        ['Luis Hernández Torres','3337778899','luis@outlook.com','San Juan de los Lagos','Los Pinos','Sentra SR','Diego Silva','Seguimiento','2026-07-04','315000'],
        ['Sofía García Ibarra','3781119900','sofia@icloud.com','Lagos de Moreno','Centro','Pathfinder','Ana González','Cierre','2026-07-05','789000'],
        ['Marco Reyes Castillo','3311223344','marco@gmail.com','Tepatitlán','Del Valle','Magnite','Carlos Ruiz','Cotización','2026-07-06','285000'],
        ['Carmen Soto Molina','3786543210','carmen@hotmail.com','San Juan de los Lagos','La Merced','X-Trail','Diego Silva','Primer contacto','2026-07-07','520000'],
      ]
    },
    dental: {
      name: 'citas_consultorio.csv',
      rows: [
        ['paciente','telefono','correo','fecha_cita','servicio','duracion_min','no_show','costo','aseguradora'],
        ['Ana Ruiz Pérez','3781112233','ana@gmail.com','2026-07-01','Limpieza dental','45','No','850','IMSS'],
        ['Pedro Soto García','3329991122','pedro@hotmail.com','2026-07-01','Ortodoncia','60','No','1200','Particular'],
        ['Carmen Vega López','3315553344','carmen@yahoo.com','2026-07-02','Extracción','30','Si','600','ISSSTE'],
        ['Marco Torres Alba','3337774455','marco@gmail.com','2026-07-02','Blanqueamiento','90','No','2500','Particular'],
        ['Lupe Mora Díaz','3781224455','lupe@icloud.com','2026-07-03','Revisión','20','No','350','IMSS'],
        ['Roberto Flores Sanz','3316667788','rob@gmail.com','2026-07-03','Endodoncia','80','No','3200','Particular'],
      ]
    },
    retail: {
      name: 'ventas_joyeria.csv',
      rows: [
        ['cliente','telefono','rfc','producto','categoria','cantidad','precio_unitario','total','fecha','vendedor'],
        ['Joyería Reyes SA','3781112200','JRY930512AB1','Collar oro 18k','Collares','1','18500','18500','2026-07-01','Víctor'],
        ['Sr. Gutiérrez','3329998877','GUTJ850301CD2','Anillo compromiso','Anillos','1','32000','32000','2026-07-02','Araceli'],
        ['Dra. Castro','3315556677','CASD921115EF3','Pulsera plata','Pulseras','2','4200','8400','2026-07-03','René'],
        ['Tienda Orozco','3337772233','ORZ010615GH4','Aretes brillantes','Aretes','5','3500','17500','2026-07-04','Víctor'],
        ['María Ibarra','3781220011','IBAM951205IJ5','Dijes pack x3','Dijes','3','1800','5400','2026-07-05','Araceli'],
      ]
    }
  };

  /* ═══════════════════════════════════════════
     LÓGICA DE TRANSFORMACIÓN
  ═══════════════════════════════════════════ */
  function guessRule(col) {
    const lower = col.toLowerCase().replace(/[_\s]/g, '');
    return SENSITIVE.some(k => lower.includes(k)) ? 'tokenizar' : 'conservar';
  }

  function applyRule(value, rule, rowIndex) {
    if (value === undefined || value === null || value === '') return '';
    const str = String(value);
    switch (rule) {
      case 'suprimir':
        return '[SUPRIMIDO]';
      case 'tokenizar':
        return 'ID-' + String(rowIndex + 1).padStart(5, '0');
      case 'enmascarar':
        if (str.length <= 3) return '★'.repeat(str.length);
        return str.slice(0, 2) + '★'.repeat(Math.max(1, str.length - 4)) + str.slice(-2);
      case 'rango': {
        const num = parseFloat(str.replace(/[^0-9.-]/g, ''));
        if (isNaN(num)) return str;
        if (num < 1000)    return 'Menos de $1K';
        if (num < 5000)    return '$1K – $5K';
        if (num < 20000)   return '$5K – $20K';
        if (num < 50000)   return '$20K – $50K';
        if (num < 100000)  return '$50K – $100K';
        return 'Más de $100K';
      }
      default:
        return str;
    }
  }

  function getAnonData() {
    return parsedData.map((row, rIdx) =>
      headers.map((h, cIdx) => applyRule(row[cIdx], columnRules[h] || 'conservar', rIdx))
    );
  }

  function countRule(r) {
    return Object.values(columnRules).filter(v => v === r).length;
  }

  function countProtected() {
    return Object.values(columnRules).filter(v => v !== 'conservar').length;
  }

  /* ═══════════════════════════════════════════
     PRESETS
  ═══════════════════════════════════════════ */
  function applyPreset(preset) {
    headers.forEach(h => {
      const lower = h.toLowerCase().replace(/[_\s]/g, '');
      const isSensitive = SENSITIVE.some(k => lower.includes(k));
      if (preset === 'nissan') {
        const supr = ['nombre','name','telefono','phone','tel','celular','correo','email','rfc','curp','domicilio'];
        if (supr.some(k => lower.includes(k))) columnRules[h] = 'suprimir';
        else columnRules[h] = 'conservar';
      } else if (preset === 'suprimir_todo') {
        if (isSensitive) columnRules[h] = 'suprimir';
      } else if (preset === 'tokenizar_todo') {
        if (isSensitive) columnRules[h] = 'tokenizar';
      } else if (preset === 'enmascarar_todo') {
        if (isSensitive) columnRules[h] = 'enmascarar';
      }
    });
    render();
  }

  /* ═══════════════════════════════════════════
     CARGA DE ARCHIVO
  ═══════════════════════════════════════════ */
  function handleFile(file) {
    if (!file) return;
    fileName = file.name;
    Papa.parse(file, {
      complete(res) {
        const rows = res.data.filter(r => r.some(c => c !== ''));
        if (rows.length < 2) { alert('El archivo no tiene datos suficientes.'); return; }
        headers    = rows[0];
        parsedData = rows.slice(1);
        columnRules = {};
        headers.forEach(h => { columnRules[h] = guessRule(h); });
        setStep(2);
      },
      skipEmptyLines: true
    });
  }

  function loadDemo(key) {
    const demo = DEMOS[key];
    fileName   = demo.name;
    headers    = demo.rows[0];
    parsedData = demo.rows.slice(1);
    columnRules = {};
    headers.forEach(h => { columnRules[h] = guessRule(h); });
    setStep(2);
  }

  /* ═══════════════════════════════════════════
     DESCARGA
  ═══════════════════════════════════════════ */
  function downloadCSV() {
    const anonRows = getAnonData();
    const csvStr = Papa.unparse([headers, ...anonRows]);
    const blob = new Blob(['\uFEFF' + csvStr], { type: 'text/csv;charset=utf-8;' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    const base = fileName.replace(/\.(csv|xlsx|txt)$/i, '');
    a.href     = url;
    a.download = base + '_ANONIMIZADO.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ═══════════════════════════════════════════
     RENDER
  ═══════════════════════════════════════════ */
  function setStep(n) {
    step = n;
    ['s1','s2','s3','s4'].forEach((id, i) => {
      const el = document.getElementById(id);
      if (!el) return;
      const idx = i + 1;
      el.className = 'step-pill' + (idx === n ? ' active' : idx < n ? ' done' : '');
    });
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function render() {
    const el = document.getElementById('stepContent');
    if (!el) return;
    if (step === 1) el.innerHTML = renderStep1();
    else if (step === 2) el.innerHTML = renderStep2();
    else if (step === 3) el.innerHTML = renderStep3();
    else el.innerHTML = renderStep4();
  }

  /* ── PASO 1 ── */
  function renderStep1() {
    return `
    <div class="card">
      <div class="card-title">📂 Cargar archivo de datos</div>
      <div class="drop-zone" id="dropZone"
           onclick="document.getElementById('fileInput').click()"
           ondragover="event.preventDefault();this.classList.add('over')"
           ondragleave="this.classList.remove('over')"
           ondrop="event.preventDefault();this.classList.remove('over');window._anon.drop(event)">
        <div class="drop-icon">📄</div>
        <div class="drop-main">Arrastra tu CSV aquí o haz clic para seleccionar</div>
        <div class="drop-sub">Exportación de cualquier sistema ERP, CRM o punto de venta — cualquier CSV o TXT delimitado por comas</div>
        <input type="file" id="fileInput" style="display:none" accept=".csv,.txt"
               onchange="window._anon.fileChosen(event)">
      </div>
    </div>

    <div class="card">
      <div class="card-title">⚡ O carga datos de ejemplo para probar</div>
      <div class="demo-row">
        <button class="demo-btn" onclick="window._anon.demo('nissan')">🚗 Demo Leads Automotriz</button>
        <button class="demo-btn" onclick="window._anon.demo('dental')">🦷 Citas consultorio</button>
        <button class="demo-btn" onclick="window._anon.demo('retail')">💎 Ventas joyería</button>
      </div>
    </div>

    <div class="alert alert-info">
      <span class="alert-icon">ℹ️</span>
      <span><b>Tu privacidad:</b> Este anonimizador funciona 100% en tu navegador. Ningún archivo se sube a ningún servidor. Tus datos nunca salen de tu computadora.</span>
    </div>`;
  }

  /* ── PASO 2 ── */
  function renderStep2() {
    const protected_ = countProtected();
    const rows = headers.map((h, colIdx) => {
      const sample = parsedData.slice(0, 3).map(r => r[colIdx] || '').filter(Boolean).join(' · ');
      const rule   = columnRules[h] || 'conservar';
      const tech   = TECHNIQUES.find(t => t.value === rule);
      const badgeHtml = tech ? `<span class="badge ${tech.badge}">${tech.label}</span>` : '';
      const opts   = TECHNIQUES.map(t =>
        `<option value="${t.value}" ${t.value === rule ? 'selected' : ''}>${t.label}</option>`
      ).join('');
      const safeH  = h.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      return `
      <tr>
        <td>
          <div class="col-name">${h}</div>
          <div class="col-sample">${sample.slice(0, 70)}${sample.length > 70 ? '…' : ''}</div>
        </td>
        <td>${badgeHtml}</td>
        <td><select onchange="window._anon.rule('${safeH}', this.value)">${opts}</select></td>
      </tr>`;
    }).join('');

    return `
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num">${headers.length}</div><div class="stat-lbl">Columnas</div></div>
      <div class="stat-card"><div class="stat-num">${parsedData.length}</div><div class="stat-lbl">Filas</div></div>
      <div class="stat-card"><div class="stat-num">${protected_}</div><div class="stat-lbl">Protegidas</div></div>
      <div class="stat-card"><div class="stat-num">${countRule('conservar')}</div><div class="stat-lbl">Sin cambios</div></div>
    </div>

    <div class="card">
      <div class="card-title">⚙️ Reglas rápidas por perfil</div>
      <div class="quick-row">
        <button class="quick-btn" onclick="window._anon.preset('nissan')">🚗 Perfil Automotriz (leads)</button>
        <button class="quick-btn" onclick="window._anon.preset('suprimir_todo')">🚫 Suprimir todos los sensibles</button>
        <button class="quick-btn" onclick="window._anon.preset('tokenizar_todo')">🔑 Tokenizar todos los sensibles</button>
        <button class="quick-btn" onclick="window._anon.preset('enmascarar_todo')">★ Enmascarar todos los sensibles</button>
      </div>
    </div>

    <div class="card" style="padding: 0; overflow: hidden;">
      <div class="col-table-wrap">
        <table class="col-table">
          <thead>
            <tr>
              <th style="width: 40%;">Columna / Muestra de datos</th>
              <th style="width: 25%;">Técnica aplicada</th>
              <th style="width: 35%;">Cambiar técnica</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>

    <hr class="divider">
    <div class="btn-row">
      <button class="btn btn-primary" onclick="window._anon.go(3)">Ver vista previa →</button>
      <button class="btn btn-outline"  onclick="window._anon.go(1)">← Cargar otro archivo</button>
    </div>`;
  }

  /* ── PASO 3 ── */
  function renderStep3() {
    const anonRows  = getAnonData();
    const preview   = anonRows.slice(0, 6);
    const protected_ = countProtected();
    const pct       = Math.round((protected_ / headers.length) * 100);

    const headerHtml = headers.map(h => {
      const rule   = columnRules[h] || 'conservar';
      const colors = {
        conservar:  '#27AE60',
        suprimir:   '#E74C3C',
        tokenizar:  '#185FA5',
        enmascarar: '#D35400',
        rango:      '#7D3C98'
      };
      return `<th>
        ${h}
        <div style="font-size:9px;color:${colors[rule]||'#A8CC00'};font-weight:400;opacity:.9;margin-top:2px;">${rule}</div>
      </th>`;
    }).join('');

    const bodyHtml = preview.map(row => {
      const cells = row.map((cell, cIdx) => {
        const rule = columnRules[headers[cIdx]] || 'conservar';
        const cls  = rule === 'suprimir'   ? 'cell-suprimido' :
                     rule === 'tokenizar'  ? 'cell-token'     :
                     rule === 'enmascarar' ? 'cell-mascara'   :
                     rule === 'rango'      ? 'cell-rango'     : 'cell-ok';
        return `<td class="${cls}">${cell !== '' ? cell : '—'}</td>`;
      }).join('');
      return `<tr>${cells}</tr>`;
    }).join('');

    return `
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num">${parsedData.length}</div><div class="stat-lbl">Filas procesadas</div></div>
      <div class="stat-card"><div class="stat-num">${protected_}</div><div class="stat-lbl">Columnas protegidas</div></div>
      <div class="stat-card"><div class="stat-num">${pct}%</div><div class="stat-lbl">Nivel de protección</div></div>
      <div class="stat-card"><div class="stat-num">${countRule('suprimir')}</div><div class="stat-lbl">Suprimidas</div></div>
    </div>

    <div class="card" style="padding: 0; overflow: hidden;">
      <div style="padding: 16px 20px 10px; font-size: 13px; font-weight: 700; color: var(--navy); border-bottom: 1px solid var(--border);">
        Vista previa — primeras 6 filas anonimizadas
      </div>
      <div class="preview-wrap">
        <table class="preview-table">
          <thead><tr>${headerHtml}</tr></thead>
          <tbody>${bodyHtml}</tbody>
        </table>
      </div>
      <div style="padding: 12px 20px;">
        <div class="preview-legend">
          <div class="legend-item"><div class="legend-dot" style="background:var(--text)"></div>Conservado</div>
          <div class="legend-item"><div class="legend-dot" style="background:#E74C3C"></div>Suprimido</div>
          <div class="legend-item"><div class="legend-dot" style="background:#185FA5"></div>Tokenizado</div>
          <div class="legend-item"><div class="legend-dot" style="background:#D35400"></div>Enmascarado</div>
          <div class="legend-item"><div class="legend-dot" style="background:#7D3C98"></div>Rango</div>
        </div>
      </div>
    </div>

    <hr class="divider">
    <div class="btn-row">
      <button class="btn btn-download" onclick="window._anon.go(4)">Descargar CSV anonimizado ↓</button>
      <button class="btn btn-outline"  onclick="window._anon.go(2)">← Ajustar columnas</button>
    </div>`;
  }

  /* ── PASO 4 ── */
  function renderStep4() {
    const base       = fileName.replace(/\.(csv|xlsx|txt)$/i, '');
    const anonName   = base + '_ANONIMIZADO.csv';
    const protected_ = countProtected();
    const pct        = Math.round((protected_ / headers.length) * 100);

    return `
    <div class="card">
      <div class="success-center">
        <div class="success-icon">✅</div>
        <div class="success-title">Archivo listo para descargar</div>
        <div class="success-file">${anonName}</div>
        <div class="stats-row" style="max-width: 460px; margin: 0 auto 20px;">
          <div class="stat-card"><div class="stat-num">${parsedData.length}</div><div class="stat-lbl">Filas procesadas</div></div>
          <div class="stat-card"><div class="stat-num">${headers.length}</div><div class="stat-lbl">Columnas totales</div></div>
          <div class="stat-card"><div class="stat-num">${protected_}</div><div class="stat-lbl">Cols. protegidas</div></div>
          <div class="stat-card"><div class="stat-num">${pct}%</div><div class="stat-lbl">Nivel protección</div></div>
        </div>
        <button class="btn btn-download" onclick="window._anon.download()" style="font-size:14px; padding: 12px 28px; margin: 0 auto;">
          ↓ Descargar ${anonName}
        </button>
      </div>
    </div>

    <div class="alert alert-success">
      <span class="alert-icon">✅</span>
      <div>
        <b>Este archivo es seguro para:</b><br>
        Subir a Claude para análisis · Alimentar dashboards · Compartir con el equipo para auditoría · Usar con cualquier herramienta de IA sin exponer datos personales.
      </div>
    </div>

    <div class="alert alert-danger">
      <span class="alert-icon">⚠️</span>
      <div>
        <b>Importante:</b> El archivo original <code>${fileName}</code> con datos crudos debe quedarse solo en tu computadora, en la carpeta DATOS_CRUDOS. Nunca lo compartas ni lo subas a plataformas externas.
      </div>
    </div>

    <hr class="divider">
    <div class="btn-row">
      <button class="btn btn-primary"  onclick="window._anon.go(1)">← Procesar otro archivo</button>
      <button class="btn btn-outline"  onclick="window._anon.go(2)">Ajustar reglas</button>
      <button class="btn btn-download" onclick="window._anon.download()">↓ Descargar de nuevo</button>
    </div>`;
  }

  /* ═══════════════════════════════════════════
     API PÚBLICA
  ═══════════════════════════════════════════ */
  window._anon = {
    drop:      e  => handleFile(e.dataTransfer.files[0]),
    fileChosen:e  => handleFile(e.target.files[0]),
    demo:      k  => loadDemo(k),
    rule:     (h, v) => { columnRules[h] = v; render(); },
    preset:    p  => applyPreset(p),
    go:        n  => setStep(n),
    download:  () => downloadCSV(),
  };

  /* INICIO */
  render();
})();
</script>
</body>
</html>
